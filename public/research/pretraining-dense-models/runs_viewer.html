<style>
:root {
  color-scheme: light;
  --bg: #eceef1;
  --panel: #fcfcfd;
  --side: #f6f7f9;
  --ink: #0f1217;
  --ink-2: #4a515c;
  --ink-3: #868c96;
  --rule: #e2e5e9;
  --grid-major: #e6e8ec;
  --grid-minor: #f2f3f5;
  --axis: #c3c8cf;
  --chip: #e9ecef;
  --on: #0f1217;
  --on-ink: #fcfcfd;
  --good: #1d7a3e;
  --bad: #b3372f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* the component: one fixed frame, only the plot carousel scrolls */
.frame { height: 100%; padding: 12px 16px; }
.viz { height: 100%; min-height: 480px; display: grid; grid-template-columns: 250px minmax(0, 1fr); background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 0 rgb(15 18 23 / .03), 0 18px 40px -28px rgb(15 18 23 / .35); }

/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.side-hd { padding: 20px 20px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.side-hd h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1; margin: 0; }
.side-hd button { border: 0; background: none; padding: 2px 0; font-size: 12px; color: var(--ink-3); cursor: pointer; border-bottom: 1px solid transparent; }
.side-hd button:hover { color: var(--ink); border-color: var(--ink-3); }
.side-sub { padding: 0 20px 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; }
.run-list { display: grid; gap: 2px; padding: 0 10px 12px; overflow-y: auto; }
.run { display: grid; grid-template-columns: 16px 1fr auto; column-gap: 11px; align-items: center; text-align: left; border: 0; background: transparent; padding: 10px 10px; border-radius: 9px; cursor: pointer; }
.run:hover { background: rgb(15 18 23 / .045); }
.run .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--c); background: var(--c); display: grid; place-items: center; }
.run[aria-pressed="false"] .box { background: transparent; }
.run[aria-pressed="false"] .box svg { visibility: hidden; }
.run .name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run[aria-pressed="false"] .name { color: var(--ink-3); }
.run .val { text-align: right; display: grid; justify-items: end; line-height: 1.2; }
.run .val b { font-family: var(--mono); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.run[aria-pressed="false"] .val { opacity: .4; }

/* main column */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 16px 12px 20px; border-bottom: 1px solid var(--rule); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1 1 280px; min-width: 0; scroll-snap-type: x proximity; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; scroll-snap-align: start; border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--chip); }
.tab[aria-selected="true"] { background: var(--on); color: var(--on-ink); }
.ctls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl-lbl { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-size: 12.5px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(15 18 23 / .12); }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.check input { accent-color: var(--on); margin: 0; width: 14px; height: 14px; }
.check input:disabled, .check input:disabled + span { opacity: .4; cursor: not-allowed; }
input[type="range"] { width: 90px; accent-color: var(--on); }

/* vertical carousel */
.stage { position: relative; min-height: 0; }
.carousel { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.slide { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 16px 44px 10px 20px; }
.slide-hd { display: flex; align-items: baseline; gap: 10px; }
.slide-hd h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1; margin: 0; }
.slide-hd em { font-family: var(--serif); font-size: 19px; color: var(--ink-3); }
.slide-hd .reset { margin-left: auto; align-self: center; border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 3px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.slide-hd .reset:hover { color: var(--ink); border-color: var(--axis); }
.slide svg { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; }
.slide svg text { font-family: var(--mono); font-size: 11px; fill: var(--ink-3); }
.slide svg .xt { font-family: var(--sans); font-size: 11.5px; fill: var(--ink-3); }
.slide svg .pill { font-family: var(--mono); font-size: 11px; fill: var(--on-ink); }
.pager { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: grid; gap: 8px; }
.pager button { width: 8px; height: 8px; padding: 0; border-radius: 999px; border: 0; background: var(--axis); cursor: pointer; transition: height .2s, background-color .2s; }
.pager button[aria-current="true"] { height: 22px; background: var(--ink); }

@media (max-width: 760px) {
  .frame { padding: 8px; }
  .viz { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--rule); }
  .side-hd { padding: 14px 14px 8px; }
  .side-hd h1 { font-size: 22px; }
  .side-sub { display: none; }
  .run-list { display: flex; overflow-x: auto; overflow-y: hidden; padding: 0 8px 10px; scrollbar-width: none; }
  .run { flex: none; grid-template-columns: 14px auto auto; padding: 6px 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; }
  .bar { padding: 10px 12px; }
  .slide { padding: 12px 30px 8px 10px; }
  .slide-hd h2 { font-size: 24px; }
  .pager { right: 10px; }
}
@media (prefers-reduced-motion: reduce) { .pager button { transition: none; } }
/* ?embed: sits inside an article, so drop the page ground and outer padding */
html.embed body { background: transparent; }
html.embed .frame { padding: 0; }
</style>

    const y = ys[i];
    if (y == null) { out[i] = null; continue; }
    last = last * w + (1 - w) * y;
    debias = debias * w + (1 - w);
    out[i] = last / debias;
  }
  return out;
}

function niceTicks(lo, hi, n) {
  const span = hi - lo || Math.abs(hi) || 1;
  const step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) ticks.push(+v.toPrecision(12));
  return { ticks, step };
}

function logTicks(lo, hi) {
  const t = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
    for (const m of [1, 2, 5]) { const v = m * Math.pow(10, e); if (v >= lo && v <= hi) t.push(v); }
  return t.length >= 2 ? t : niceTicks(lo, hi, 4).ticks;
}

function bisect(xs, x) {
  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] < x) lo = mid; else hi = mid; }
  return Math.abs(xs[lo] - x) <= Math.abs(xs[hi] - x) ? lo : hi;
}

/* ---------- series ---------- */
function buildSeries(mk) {
  const m = METRICS[mk];
  const useDelta = state.delta && m.delta;
  const pick = r => mk === "eval"
    ? { xs: r.eval[state.xaxis], steps: r.eval.step, ys: r.eval.loss.slice() }
    : { xs: r[state.xaxis], steps: r.step, ys: m.smooth ? emaDebiased(r[mk], state.smooth) : r[mk].slice() };
  const ref = pick(RUN_DATA.runs.find(r => r.key === REF));
  const refByStep = new Map(ref.steps.map((st, i) => [st, ref.ys[i]]));
  return RUN_DATA.runs.map((r, i) => {
    const p = pick(r);
    let ys = p.ys;
    if (useDelta) ys = ys.map((y, j) => { const rv = refByStep.get(p.steps[j]); return y == null || rv == null ? null : y - rv; });
    return { run: r, color: `var(${COLORS[i]})`, visible: !state.hidden.has(r.key), xs: p.xs, steps: p.steps, ys };
  });
}

function xDomain() {
  const r0 = RUN_DATA.runs[0], xs = r0[state.xaxis];
  const maxX = Math.max(...RUN_DATA.runs.map(r => r[state.xaxis][r[state.xaxis].length - 1]));
  if (state.range === "all") return [0, maxX];
  if (state.range === "warm") return [xs[Math.min(150, xs.length - 1)], maxX];
  const cut = r0.tokens[r0.tokens.length - 1] - 1;
  return [xs[bisect(r0.tokens, cut)], maxX];
}

/* ---------- one plot slide ---------- */
class Plot {
  constructor(mk, host) {
    this.mk = mk;
    this.m = METRICS[mk];
    this.el = document.createElement("section");
    this.el.className = "slide";
    this.el.id = "plot-" + mk;
    this.el.innerHTML = `<div class="slide-hd"><h2>${this.m.title}</h2><em></em>
      <button type="button" class="reset" hidden>Reset zoom</button></div><svg role="img"></svg>`;
    host.appendChild(this.el);
    this.svg = this.el.querySelector("svg");
    this.resetBtn = this.el.querySelector(".reset");
    this.zoom = null;   // {x0, x1, y0?, y1?} in data units, or null
    this.drag = null;
    this.resetBtn.addEventListener("click", () => this.setZoom(null));
    this.svg.addEventListener("dblclick", () => this.setZoom(null));
    // drag a box to zoom, like wandb; touch keeps scrolling the carousel
    this.svg.addEventListener("pointerdown", e => {
      if (e.pointerType === "touch" || e.button !== 0 || !this.geom) return;
      const p = this.svgPoint(e);
      const { P, iw, ih } = this.geom;
      if (p.x < P.l || p.x > P.l + iw || p.y < P.t || p.y > P.t + ih) return;
      this.drag = { x: p.x, y: p.y };
      this.svg.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    this.svg.addEventListener("pointermove", e => {
      if (this.drag) return this.drawSelection(this.svgPoint(e));
      setHover(this, this.pointerX(e));
    });
    this.svg.addEventListener("pointerup", e => {
      if (!this.drag) return;
      const a = this.drag, b = this.clampPoint(this.svgPoint(e));
      this.drag = null;
      this.svg.querySelector(".sel").innerHTML = "";
      const dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
      if (dx < 6) return;
      const g = this.geom;
      const z = { x0: g.xInv(Math.min(a.x, b.x)), x1: g.xInv(Math.max(a.x, b.x)) };
      if (dy >= 12) { z.y0 = g.yInv(Math.max(a.y, b.y)); z.y1 = g.yInv(Math.min(a.y, b.y)); }
      const minSpan = state.xaxis === "tokens" ? 0.02 : 10;
      if (z.x1 - z.x0 < minSpan) { const c = (z.x0 + z.x1) / 2; z.x0 = c - minSpan / 2; z.x1 = c + minSpan / 2; }
      this.setZoom(z);
    });
    this.svg.addEventListener("pointerleave", () => { if (!this.drag) setHover(this, null); });
  }

  svgPoint(e) {
    const rect = this.svg.getBoundingClientRect(), g = this.geom;
    return { x: (e.clientX - rect.left) * (g.W / rect.width), y: (e.clientY - rect.top) * (g.H / rect.height) };
  }

  clampPoint(p) {
    const { P, iw, ih } = this.geom;
    return { x: Math.min(Math.max(p.x, P.l), P.l + iw), y: Math.min(Math.max(p.y, P.t), P.t + ih) };
  }

  drawSelection(p) {
    const a = this.drag, b = this.clampPoint(p), { P, ih } = this.geom;
    const boxY = Math.abs(b.y - a.y) >= 12;
    const x = Math.min(a.x, b.x), w = Math.abs(b.x - a.x);
    const y = boxY ? Math.min(a.y, b.y) : P.t, h = boxY ? Math.abs(b.y - a.y) : ih;
    this.svg.querySelector(".hover").innerHTML = "";
    this.svg.querySelector(".sel").innerHTML =
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--ink)" fill-opacity=".06" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/>`;
  }

  setZoom(z) {
    this.zoom = z;
    this.render();
    hoverX = null;
    updateSide();
  }

  pointerX(e) {
    const g = this.geom; if (!g) return null;
    const rect = this.svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (g.W / rect.width);
    if (px < g.P.l || px > g.P.l + g.iw) return null;
    return g.x0 + (px - g.P.l) / g.iw * (g.x1 - g.x0);
  }

  render() {
    const m = this.m, mk = this.mk;
    const useDelta = this.useDelta = state.delta && m.delta;
    const logY = this.logY = state.log && !useDelta;
    this.el.querySelector(".slide-hd em").textContent = useDelta ? "Δ vs QK-norm baseline" : "";
    const series = this.series = buildSeries(mk);
    const W = Math.max(280, this.svg.clientWidth || 900), H = Math.max(200, this.svg.clientHeight || 480);

    const z = this.zoom;
    this.resetBtn.hidden = !z;
    const [x0, x1] = z ? [z.x0, z.x1] : xDomain();
    let y0 = Infinity, y1 = -Infinity;
    for (const se of series) {
      if (!se.visible) continue;
      for (let i = 0; i < se.xs.length; i++) {
        const x = se.xs[i], y = se.ys[i];
        if (x < x0 || x > x1 || y == null || (logY && y <= 0)) continue;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    const empty = !isFinite(y0);
    if (empty) { y0 = 0; y1 = 1; }
    const yZoomed = z && z.y0 != null;
    if (yZoomed) { y0 = z.y0; y1 = z.y1; }
    if (useDelta && !yZoomed) { const a = Math.max(Math.abs(y0), Math.abs(y1)) || 0.01; y0 = Math.min(y0, -a * 0.15); y1 = Math.max(y1, a * 0.15); }
    let yt, ystep = null;
    if (logY) {
      yt = logTicks(y0, y1);
    } else if (yZoomed) {
      ({ ticks: yt, step: ystep } = niceTicks(y0, y1, H < 360 ? 4 : 6));
    } else {
      const pad = (y1 - y0) * 0.06 || Math.abs(y1) * 0.05 || 0.01;
      y0 = m.zeroFloor && y0 - pad < 0 ? 0 : y0 - pad;
      y1 += pad;
      ({ ticks: yt, step: ystep } = niceTicks(y0, y1, H < 360 ? 4 : 6));
    }

    const yLabel = v => useDelta
      ? (v === 0 ? "0" : (v > 0 ? "+" : "−") + (+Math.abs(v).toPrecision(3)))
      : String(+v.toPrecision(4));
    const P = { l: Math.max(40, Math.max(...yt.map(v => yLabel(v).length)) * 6.8 + 14), r: 6, t: 14, b: 40 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const X = x => P.l + (x - x0) / (x1 - x0) * iw;
    const ly0 = Math.log(y0), ly1 = Math.log(y1);
    const Y = logY ? y => P.t + ih - (Math.log(y) - ly0) / (ly1 - ly0) * ih : y => P.t + ih - (y - y0) / (y1 - y0) * ih;
    const xInv = px => x0 + (px - P.l) / iw * (x1 - x0);
    const yInv = logY ? py => Math.exp(ly0 + (P.t + ih - py) / ih * (ly1 - ly0)) : py => y0 + (P.t + ih - py) / ih * (y1 - y0);
    this.geom = { X, Y, xInv, yInv, x0, x1, P, iw, ih, W, H };

    const { ticks: xt, step: xstep } = niceTicks(x0, x1, W < 560 ? 4 : 8);
    const xLabel = v => state.xaxis === "tokens" ? (+v.toPrecision(6)) + "B" : v.toLocaleString("en-US");
    let g = "";
    if (ystep) for (let v = Math.ceil(y0 / (ystep / 5)) * (ystep / 5); v <= y1; v += ystep / 5) {
      const y = Y(v).toFixed(1); g += `<line x1="${P.l}" x2="${P.l + iw}" y1="${y}" y2="${y}" stroke="var(--grid-minor)"/>`;
    }
    for (let v = Math.ceil(x0 / (xstep / 5)) * (xstep / 5); v <= x1; v += xstep / 5) {
      const x = X(v).toFixed(1); g += `<line x1="${x}" x2="${x}" y1="${P.t}" y2="${P.t + ih}" stroke="var(--grid-minor)"/>`;
    }
    for (const v of xt) {
      const x = X(v);
      g += `<line x1="${x}" x2="${x}" y1="${P.t}" y2="${P.t + ih}" stroke="var(--grid-major)"/>`;
      const lbl = xLabel(v), half = lbl.length * 3.4;
      const anchor = x - half < P.l - 8 ? "start" : x + half > W ? "end" : "middle";
      g += `<text x="${anchor === "start" ? Math.max(x, P.l - 8) : anchor === "end" ? W : x}" y="${P.t + ih + 18}" text-anchor="${anchor}">${lbl}</text>`;
    }
    for (const v of yt) {
      const y = Y(v);
      if (y < P.t - 1 || y > P.t + ih + 1) continue;
      const zero = useDelta && v === 0;
      g += `<line x1="${P.l}" x2="${P.l + iw}" y1="${y}" y2="${y}" stroke="var(${zero ? "--axis" : "--grid-major"})" stroke-width="${zero ? 1.5 : 1}"/>`;
      g += `<text x="${P.l - 10}" y="${y + 3.5}" text-anchor="end">${yLabel(v)}</text>`;
    }
    g += `<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="none" stroke="var(--axis)"/>`;
    g += `<text class="xt" x="${P.l + iw}" y="${H - 4}" text-anchor="end">${state.xaxis === "tokens" ? "tokens seen" : "step"}</text>`;

    let paths = "", dots = "";
    const isEval = mk === "eval";
    const order = series.map((se, i) => i).sort((a, b) => (series[a].run.key === REF) - (series[b].run.key === REF));
    for (const idx of order) {
      const se = series[idx];
      if (!se.visible) continue;
      let d = "", pen = false, last = null;
      for (let i = 0; i < se.xs.length; i++) {
        const x = se.xs[i], y = se.ys[i];
        if (y == null || x < x0 || x > x1 || (logY && y <= 0)) { pen = false; continue; }
        const px = X(x).toFixed(1), py = Y(y).toFixed(1);
        d += (pen ? "L" : "M") + px + " " + py;
        pen = true; last = [px, py];
        if (isEval) dots += `<circle cx="${px}" cy="${py}" r="3.5" fill="${se.color}" stroke="var(--panel)" stroke-width="2"/>`;
      }
      paths += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${isEval ? 2 : 1.75}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (last && !isEval) dots += `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${se.color}" stroke="var(--panel)" stroke-width="2"/>`;
    }
    const cid = "clip-" + mk;
    this.svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    this.svg.setAttribute("aria-label", `${m.title}${useDelta ? ", difference from the QK-norm baseline," : ""} by ${state.xaxis}`);
    this.svg.innerHTML = `<defs><clipPath id="${cid}"><rect x="${P.l}" y="${P.t - 6}" width="${iw + 6}" height="${ih + 12}"/></clipPath></defs>
      ${g}<g clip-path="url(#${cid})">${paths}${dots}</g>
      ${empty ? `<text x="${P.l + iw / 2}" y="${P.t + ih / 2}" text-anchor="middle">No runs selected</text>` : ""}
      <g class="hover" style="pointer-events:none"></g><g class="sel" style="pointer-events:none"></g>`;
  }

  valFmt(v) {
    if (v == null) return "—";
    if (this.useDelta) return fmt.delta(v);
    return this.mk === "grad" ? fmt.grad(v) : fmt.loss(v);
  }

  /* values of every run at data-x xv (null = end of run) */
  sample(xv) {
    return this.series.map(se => {
      const i = xv == null ? se.xs.length - 1 : bisect(se.xs, xv);
      return { se, x: se.xs[i], y: se.ys[i], step: se.steps[i] };
    });
  }

  drawHover(xv) {
    const hg = this.svg.querySelector(".hover");
    if (!hg) return;
    if (xv == null) { hg.innerHTML = ""; return; }
    const { X, Y, P, ih, iw, x0, x1 } = this.geom;
    const pts = this.sample(xv);
    const anchor = pts.find(p => p.se.visible) || pts[0];
    if (anchor.x < x0 || anchor.x > x1) { hg.innerHTML = ""; return; }
    const hx = X(anchor.x);
    let s = `<line x1="${hx}" x2="${hx}" y1="${P.t}" y2="${P.t + ih}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/>`;
    for (const p of pts) {
      if (!p.se.visible || p.y == null || (this.logY && p.y <= 0)) continue;
      const y = Y(p.y), x = X(p.x);
      if (y >= P.t && y <= P.t + ih && x >= P.l - 1) s += `<circle cx="${x}" cy="${y}" r="4.5" fill="${p.se.color}" stroke="var(--panel)" stroke-width="2"/>`;
    }
    const r0 = anchor.se.run, i0 = bisect(r0.step, anchor.step);
    const label = state.xaxis === "tokens" ? r0.tokens[i0].toFixed(2) + "B" : anchor.step.toLocaleString("en-US");
    const lw = label.length * 6.8 + 14, lx = Math.min(Math.max(hx - lw / 2, P.l), P.l + iw - lw);
    s += `<rect x="${lx}" y="${P.t + ih + 5}" width="${lw}" height="18" rx="4" fill="var(--on)"/>`;
    s += `<text class="pill" x="${lx + lw / 2}" y="${P.t + ih + 17.5}" text-anchor="middle">${label}</text>`;
    hg.innerHTML = s;
  }
}

/* ---------- controller ---------- */
const carousel = document.getElementById("carousel");
const plots = MKEYS.map(k => new Plot(k, carousel));
let active = 0, hoverX = null;

function setHover(plot, xv) {
  hoverX = xv;
  plot.drawHover(xv);
  updateSide();
}

function updateSide() {
  const p = plots[active];
  if (!p.series) return;
  const pts = p.sample(hoverX ?? (p.zoom ? p.zoom.x1 : null));
  document.getElementById("side-metric").textContent = p.m.title + (p.useDelta ? " Δ" : "");
  const anchor = pts.find(q => q.se.visible) || pts[0];
  document.getElementById("side-where").textContent = hoverX == null ? "" :
    state.xaxis === "tokens" ? anchor.se.run.tokens[bisect(anchor.se.run.step, anchor.step)].toFixed(2) + "B" : "step " + anchor.step.toLocaleString("en-US");
  pts.forEach(q => {
    const row = document.querySelector(`.run[data-k="${q.se.run.key}"] .val`);
    row.innerHTML = `<b>${p.valFmt(q.y)}</b>`;
  });
}

function renderRuns() {
  document.getElementById("runs").innerHTML = RUN_DATA.runs.map((r, i) => `
    <button type="button" class="run" data-k="${r.key}" aria-pressed="${!state.hidden.has(r.key)}" style="--c:var(${COLORS[i]})" title="${r.desc}">
      <span class="box"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="name">${r.label}</span><span class="val"></span>
    </button>`).join("");
}

function renderControls() {
  document.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(state[seg.dataset.k] === b.dataset.v))));
  const sm = document.getElementById("smooth");
  sm.value = state.smooth; sm.disabled = !plots[active].m.smooth;
  document.getElementById("smooth-v").textContent = state.smooth.toFixed(2);
  document.getElementById("log").checked = state.log;
  const dl = document.getElementById("delta");
  dl.checked = state.delta; dl.disabled = !plots[active].m.delta;
  document.querySelectorAll(".run").forEach(b => b.setAttribute("aria-pressed", String(!state.hidden.has(b.dataset.k))));
  document.querySelectorAll(".tab").forEach((t, i) => t.setAttribute("aria-selected", String(i === active)));
  document.querySelectorAll(".pager button").forEach((b, i) => b.setAttribute("aria-current", String(i === active)));
}

function renderAll() {
  renderControls();
  plots.forEach(p => { p.render(); p.drawHover(null); });
  hoverX = null;
  updateSide();
}

function set(k, v) {
  if (["xaxis", "range", "log", "delta"].includes(k)) plots.forEach(p => { p.zoom = null; });
  state[k] = v; savePref(k, v instanceof Set ? [...v] : v); renderAll(); }

function goTo(i) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  carousel.scrollTo({ top: i * carousel.clientHeight, behavior: reduce ? "auto" : "smooth" });
}

function setActive(i) {
  if (i === active) return;
  active = i; hoverX = null;
  renderControls(); updateSide();
  document.querySelectorAll(".tab")[i].scrollIntoView({ block: "nearest", inline: "nearest" });
}

/* ---------- boot ---------- */
document.getElementById("tabs").innerHTML = MKEYS.map((k, i) =>
  `<button type="button" class="tab" role="tab" aria-controls="plot-${k}" data-i="${i}">${METRICS[k].title}</button>`).join("");
document.getElementById("pager").innerHTML = MKEYS.map((k, i) =>
  `<button type="button" data-i="${i}" aria-label="${METRICS[k].title}"></button>`).join("");
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) goTo(+b.dataset.i); });
document.getElementById("pager").addEventListener("click", e => { const b = e.target.closest("button"); if (b) goTo(+b.dataset.i); });
carousel.addEventListener("scroll", () => setActive(Math.round(carousel.scrollTop / Math.max(1, carousel.clientHeight))), { passive: true });

renderRuns();
document.getElementById("runs").addEventListener("click", e => {
  const b = e.target.closest(".run"); if (!b) return;
  const h = new Set(state.hidden);
  h.has(b.dataset.k) ? h.delete(b.dataset.k) : h.add(b.dataset.k);
  set("hidden", h);
});
document.getElementById("show-all").addEventListener("click", () => set("hidden", new Set()));
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) set(seg.dataset.k, b.dataset.v);
}));
document.getElementById("smooth").addEventListener("input", e => set("smooth", +e.target.value));
document.getElementById("log").addEventListener("change", e => set("log", e.target.checked));
document.getElementById("delta").addEventListener("change", e => set("delta", e.target.checked));

let lastSize = "";
new ResizeObserver(() => {
  const size = carousel.clientWidth + "x" + carousel.clientHeight;
  if (size === lastSize) return;
  lastSize = size;
  renderAll();
  carousel.scrollTop = active * carousel.clientHeight;
}).observe(carousel);
renderAll();
</script>
</body>
</html>
