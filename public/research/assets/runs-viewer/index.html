<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1B Pretraining Runs</title>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="viewer.css">
<script type="module" src="viewer.js"></script>
</head>
<body>
<div class="frame">
  <div class="viz">
    <aside class="side" aria-label="Experiments">
      <div class="side-hd"><h1>Experiments</h1><button type="button" id="show-all">Show all</button></div>
      <div class="side-sub"><span id="side-metric"></span><span id="side-where"></span></div>
      <div class="run-list" id="runs" role="group" aria-label="Show or hide experiments"></div>
    </aside>

    <div class="main">
      <div class="bar">
        <div class="tabs" id="tabs" role="tablist" aria-label="Metric"></div>
        <div class="ctls">
          <div class="ctl"><span class="ctl-lbl">X</span><div class="seg" data-k="xaxis">
            <button type="button" data-v="step">Step</button><button type="button" data-v="tokens">Tokens</button>
          </div></div>
          <div class="ctl"><span class="ctl-lbl">Range</span><div class="seg" data-k="range">
            <button type="button" data-v="all">All</button><button type="button" data-v="warm">After warmup</button><button type="button" data-v="tail">Last 1B</button>
          </div></div>
          <div class="ctl">
            <label class="ctl-lbl" for="smooth">Smooth</label>
            <input id="smooth" type="range" min="0" max="0.99" step="0.01">
            <span class="num" id="smooth-v"></span>
          </div>
          <label class="check"><input id="log" type="checkbox"><span>Log y</span></label>
          <label class="check"><input id="delta" type="checkbox"><span>Δ vs QK-norm baseline</span></label>
        </div>
      </div>

      <div class="stage">
        <div class="carousel" id="carousel"></div>
        <nav class="pager" id="pager" aria-label="Plots"></nav>
      </div>
    </div>
  </div>
</div>

</body>
</html>
